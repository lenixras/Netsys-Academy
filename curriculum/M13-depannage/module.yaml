id: M13
title: "Dépannage structuré"
wave: 3
prereqs: ['M6', 'M7', 'M10', 'M11']
status: full
lab:
  mode: topology
  dir: lab
  topo: topology.yaml
  checks: checks.yaml
  ttl_min: 45
  # Le setup applique l'adressage nominal (documenté dans scenario.md) puis injecte
  # 3 pannes : route blackhole sur r1, eth1 down sur r2, masque erroné sur h2.
  setup:
  - node: h1
    cmd: ip link set eth1 up && ip addr add 10.13.1.10/24 dev eth1 && ip route replace default via 10.13.1.1
  - node: r1
    cmd: ip link set eth1 up && ip link set eth2 up && ip addr add 10.13.1.1/24 dev eth1 && ip addr add 10.13.2.1/24 dev eth2 && sysctl -w net.ipv4.ip_forward=1
  - node: r2
    cmd: ip link set eth1 up && ip link set eth2 up && ip addr add 10.13.2.2/24 dev eth1 && ip addr add 10.13.3.1/24 dev eth2 && sysctl -w net.ipv4.ip_forward=1 && ip route add 10.13.1.0/24 via 10.13.2.1
  - node: h2
    cmd: ip link set eth1 up && ip addr add 10.13.3.20/24 dev eth1 && ip route replace default via 10.13.3.1
  # --- pannes injectees (l'apprenant doit les trouver et les réparer) ---
  - node: r1
    cmd: ip route add blackhole 10.13.3.0/24
  - node: r2
    cmd: ip link set eth1 down
  - node: h2
    cmd: ip addr flush dev eth1 && ip addr add 10.13.3.20/25 dev eth1
validation:
  quiz_min_score: 70
  lab_required: true
