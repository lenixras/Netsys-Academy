id: M16
title: "Infrastructure as code réseau"
wave: 4
prereqs: [M15]
status: full
lab:
  mode: topology
  dir: lab
  topo: topology.yaml
  checks: checks.yaml
  ttl_min: 45
  setup:
    - node: dev2
      cmd: mkdir -p /root/lab
    - node: dev2
      cmd: echo  | base64 -d > /root/lab/topo.yaml
    - node: dev2
      cmd: echo  | base64 -d > /root/lab/lint.py
    - node: dev2
      cmd: echo  | base64 -d > /root/lab/spec.md
    - node: dev2
      cmd: git -C /root/lab init -q -b main && git -C /root/lab config user.email lab@netsys.local && git -C /root/lab config user.name lab && git -C /root/lab config commit.gpgsign false && git -C /root/lab add -A && git -C /root/lab commit -q -m import-initial
validation:
  quiz_min_score: 70
  lab_required: true
