id: M25
title: 'Monitoring : Prometheus qui surveille un hôte'
wave: 3
prereqs:
- M3
- M10
status: full
lab:
  mode: topology
  dir: lab
  topo: topology.yaml
  checks: checks.yaml
  ttl_min: 30
  setup:
  - node: mon
    cmd: ip addr add 10.25.0.10/24 dev eth1 && ip link set eth1 up && mkdir -p /var/lib/prometheus
