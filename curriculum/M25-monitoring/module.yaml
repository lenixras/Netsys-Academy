    cmd: ip addr add 10.25.0.20/24 dev eth1 && ip link set eth1 up
  - node: mon
    cmd: 'echo ''Objectif: node_exporter sur tgt:9100, prometheus sur mon:9090, job nomme tgt.'' > /root/CONSIGNE.txt'
validation:
  quiz_min_score: 70
  lab_required: true
