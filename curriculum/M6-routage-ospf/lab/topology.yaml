name: m6-ospf
mgmt:
  network: clab-m6
  ipv4-subnet: 10.198.6.0/24
topology:
  nodes:
    r1:
      kind: linux
      image: netsys/frrlab:1
    r2:
      kind: linux
      image: netsys/frrlab:1
    r3:
      kind: linux
      image: netsys/frrlab:1
    h1:
      kind: linux
      image: netsys/labnode:1
    h2:
      kind: linux
      image: netsys/labnode:1
  links:
    - endpoints: ["r1:eth1", "r2:eth1"]   # 10.0.12.0/29
    - endpoints: ["r2:eth2", "r3:eth1"]   # 10.0.23.0/29
    - endpoints: ["r1:eth2", "r3:eth2"]   # 10.0.13.0/29
    - endpoints: ["r1:eth3", "h1:eth1"]   # 10.10.10.0/24
    - endpoints: ["r3:eth3", "h2:eth1"]   # 10.10.20.0/24
