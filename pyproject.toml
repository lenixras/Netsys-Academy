[project]
name = "netsys-academy"
version = "0.1.0"
description = "Plateforme d'apprentissage reseau/systeme : launcher de labs containerlab + verification auto"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "itsdangerous",
    "docker",
    "pyyaml",
    "markdown",
    "httpx",
    "websockets",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: tests avec labs reels (deselecte par defaut)", "slow"]
addopts = "-m 'not e2e'"
